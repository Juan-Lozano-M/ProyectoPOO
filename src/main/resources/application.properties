spring.application.name=ProyectoPOO

# Puerto: Render inyecta la variable PORT. En local usa 8080 por defecto.
server.port=${PORT:8080}

# Base de datos: configurable por variables de entorno para produccion (Render).
# En local toma los valores por defecto (PostgreSQL en localhost).
# La URL se puede dar completa con SPRING_DATASOURCE_URL, o componerla desde
# DB_HOST/DB_PORT/DB_NAME (asi es como render.yaml inyecta los datos de la BD).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehiculos_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google Maps API Key (usa variable de entorno para mayor seguridad)
# IMPORTANTE: No comitees la clave en un repositorio publico.
# Configura la variable de entorno en tu sistema y la aplicacion la tomara al arrancar.
# Recomendacion (PowerShell):
#   $env:GOOGLE_MAPS_API_KEY = 'TU_API_KEY'
# En produccion usar un secret manager o variables de entorno del servidor.
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

